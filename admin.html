================================ -->


<main>



<h2>
Weekly Appointment Reset
</h2>




<p>

Enter the admin password to reset all appointment times for the upcoming week.

</p>





<input

type="password"

id="adminPassword"

placeholder="Enter password"

>




<br><br>




<button

id="loginBtn"

>

Enter Admin

</button>







<div id="adminPanel" style="display:none;">





<h2>
Reset Appointments
</h2>





<p>

This will make all appointment times available again.

</p>





<button

id="resetBtn"

>

Reset Weekly Appointments

</button>





<p id="status"></p>





</div>
