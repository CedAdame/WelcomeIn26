<!-- ================================
     PAGE CONTENT
================================ -->


<main>


<form id="appointmentForm">


<label for="name">

Full Name

</label>


<input 
type="text"
id="name"
placeholder="Enter your name"
required>





<label for="email">

UT Email

</label>


<input
type="email"
id="email"
placeholder="example@utexas.edu"
required>





<h2>Select a Day</h2>



<div id="dayButtons">


<button 
type="button"
class="day-btn"
data-day="Monday">

Monday

</button>



<button 
type="button"
class="day-btn"
data-day="Tuesday">

Tuesday

</button>



<button 
type="button"
class="day-btn"
data-day="Wednesday">

Wednesday

</button>



<button 
type="button"
class="day-btn"
data-day="Thursday">

Thursday

</button>


</div>





<input 
type="hidden"
id="day">





<h2>Select a Time</h2>


<div id="timeButtons">

<p>
Select a day to see available times.
</p>

</div>



<input
type="hidden"
id="time">





<label for="reason">

What would you like help with?

</label>


<textarea

id="reason"

rows="5"

placeholder="Describe what you need help with..."

required>

</textarea>





<button

id="submitBtn"

class="submitBtn"

type="submit">

Request Appointment

</button>



</form>


</main>
